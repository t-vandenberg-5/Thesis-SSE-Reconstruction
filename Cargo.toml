[package]
name = "reconstructor"
version = "0.1.0"
edition = "2024"

[dependencies]
emptyblock = { path = "./emptyblock" }
query_engine = { path = "./query-engine" }
database_engine = { path = "./database-engine" } 
criterion = "0.8.2"
bumpalo = "3.20.2"
plotters = "0.3.7"
nanorand = "0.8.0"
clap = { version = "4.6.1", features = ["derive"] }
csv = "1.4.0"
plotters-backend = "0.3.7"
plotters-bitmap = "0.3.7"
chrono = "0.4.45"

[profile.bench]
inherits = "release"
debug = true

[profile.release]
lto = "fat"
codegen-units = 1

[profile.release_with_debug_assertions]
inherits = "release"
debug-assertions = true

[[bench]]
name = "components"
harness = false

[[bench]]
name = "solver"
harness = false

[[bench]]
name = "midline-solver"
harness = false
